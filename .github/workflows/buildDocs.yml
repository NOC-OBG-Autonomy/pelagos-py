name: Build Documentation

# main builds after the patch tag exists (and again on a release), so the docs
# show the tagged version rather than a .dev one.
on:
  push:
    branches:
      - dev
  workflow_run:
    workflows: ["Auto patch tag"]
    types: [completed]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags are needed for the version number

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          pip install -e .

      # The user-guide figures are drawn by the steps themselves from the demo file.
      - name: Render user-guide figures
        run: |
          python docs/scripts/render_figures.py
          python docs/scripts/explainer_figures.py

      - name: Clean Python Cache and Docs Artifacts
        run: |
          find . -name '__pycache__' -type d -exec rm -r {} +
          find . -name '*.pyc' -delete
          rm -rf docs/_build/
          rm -rf docs/api/
          ls . 

      - name: Build Documentation
        run: |
          sphinx-build -b html docs/ docs/_build/html/

      - name: Ensure Static Files Are Present
        run: |
          ls -p docs/_build/html/

      - name: Disable Jekyll Processing
        run: touch docs/_build/html/.nojekyll

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.event_name == 'release'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages  # Deploy to the root of gh-pages
          folder: docs/_build/html  # Ensure this points to the html folder
          clean: true  # Deletes old files before deployment