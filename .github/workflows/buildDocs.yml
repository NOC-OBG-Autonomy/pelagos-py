name: Build Documentation

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          pip install -e .

      # The user-guide figures are drawn by the steps themselves from a small
      # OG1 file (docs/scripts/make_docs_dataset.py). PELAGOS_DOCS_DATA_URL is a
      # repository variable pointing at that file (e.g. a release asset).
      - name: Fetch docs dataset
        if: vars.PELAGOS_DOCS_DATA_URL != ''
        run: |
          mkdir -p examples/data/docs
          curl -sSL "${{ vars.PELAGOS_DOCS_DATA_URL }}" -o examples/data/docs/Growler_677_docs.nc

      - name: Render user-guide figures
        if: vars.PELAGOS_DOCS_DATA_URL != ''
        run: python docs/scripts/render_figures.py

      - name: Clean Python Cache and Docs Artifacts
        run: |
          find . -name '__pycache__' -type d -exec rm -r {} +
          find . -name '*.pyc' -delete
          rm -rf docs/_build/
          rm -rf docs/api/
          ls . 

      - name: Build Documentation
        run: |
          sphinx-build -b html docs/ docs/_build/html/

      - name: Ensure Static Files Are Present
        run: |
          ls -p docs/_build/html/

      - name: Disable Jekyll Processing
        run: touch docs/_build/html/.nojekyll

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages  # Deploy to the root of gh-pages
          folder: docs/_build/html  # Ensure this points to the html folder
          clean: true  # Deletes old files before deployment