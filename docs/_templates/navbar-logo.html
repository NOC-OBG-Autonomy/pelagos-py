    <rect fill="#fff" x="4.15" y="4.15" width="91.7" height="27.5"/>
    <rect fill="#00b4ff" x="4.15" y="31.66" width="91.7" height="64.19"/>
    <text class="pl-title" x="120" y="64" textLength="300" lengthAdjust="spacingAndGlyphs">PELAGOS-PY</text>
