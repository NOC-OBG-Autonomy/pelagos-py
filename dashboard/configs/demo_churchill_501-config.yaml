pipeline:
  name: Complete processing pipeline
  description: A demo pipeline using Churchill (Full) data.
  out_directory: examples/data/OG1/
  log_file: complete_processing.log
  on_step_fail: pause

steps:

# ===========================================================
#                         IMPORT DATA
# ===========================================================
  - name: Load OG1
    parameters:
      file_path: examples/data/OG1/Churchill_501.nc
    diagnostics: false
  - name: Prepare OG1
    diagnostics: false
  - name: Format Checker
    parameters:
      standards: [og]
    diagnostics: false

# ===========================================================
#                    LATITUDE / LONGITUDE
# ===========================================================
  - name: Apply QC
    parameters:
      qc_settings:
        impossible date qc: {}
        impossible location qc: {}
        position on land qc: {}
        impossible speed qc: {}
    diagnostics: false

# ===========================================================
#                             CTD
# ===========================================================
  - name: Apply QC
    parameters:
      qc_settings:
        range qc:
          variable_ranges:
            PRES:
              3: [-2.4, -5, inside]
              4: [-5, -.inf, inside]
            TEMP:
              3: [-1, 30, outside]
              4: [-2.5, 40, outside]
            CNDC:
              3: [0.5, 4.2, outside]
              4: [0.2, 4.5, outside]
          also_flag:
            PRES: [CNDC, TEMP]
            CNDC: [PRES, TEMP]
            TEMP: [PRES, CNDC]
        stuck value qc:
          variables:
            PRES: 2
          also_flag:
            PRES: [CNDC, TEMP]
          plot: [PRES]
    diagnostics: false

# ===========================================================
#                TEMPERATURE CROSS CALIBRATION
# ===========================================================
  - name: Correct Values
    parameters:
      target_variable: TEMP
    diagnostics: false

# ===========================================================
#                        INTERPOLATION
# ===========================================================
  - name: Interpolate Data
    parameters:
      variables:
        PRES: [3, 4, 9]
        LATITUDE: [3, 4, 9]
        LONGITUDE: [3, 4, 9]
    diagnostics: false

# ===========================================================
#                       PROFILE FINDING
# ===========================================================
  - name: Derive CTD
    parameters:
      to_derive: [DEPTH]
    diagnostics: false
  - name: Find Profiles
    diagnostics: false
  - name: Apply QC
    parameters:
      qc_settings:
        valid profile qc:
          min_length: 50
          depth_range: [0, 1000]
          flag: 4
    diagnostics: false

# ===========================================================
#                     SALINITY ADJUSTMENT
# ===========================================================
  - name: Salinity Adjustment
    parameters:
      qc_handling_settings:
        flag_filter_settings:
          CNDC: [3, 4, 9]
          TEMP: [3, 4, 9]
          PROFILE_NUMBER: [3, 4, 9]
        reconstruction_behaviour: reinsert
        flag_mapping:
          0: 5
          1: 5
          2: 5
    diagnostics: false
  - name: Derive CTD
    parameters:
      to_derive: [PRAC_SALINITY]
    diagnostics: false

# ===========================================================
#                 SALINITY CROSS CALIBRATION
# ===========================================================
  - name: Correct Values
    parameters:
      target_variable: PRAC_SALINITY
    diagnostics: false
  - name: Derive CTD
    parameters:
      to_derive: [ABS_SALINITY, CONS_TEMP, DENSITY]
    diagnostics: false

# ===========================================================
#            CTD INTERPOLATION (POST CALIBRATION)
# ===========================================================
  - name: Interpolate Data
    parameters:
      variables:
        TEMP: [3, 4, 9]
        PRES: [3, 4, 9]
        PRAC_SALINITY: [3, 4, 9]
    diagnostics: false

# ===========================================================
#                         BACKSCATTER
# ===========================================================
  - name: Apply QC
    parameters:
      qc_settings:
        range qc:
          variable_ranges:
            BETA_BACKSCATTERING700:
              3: [0, 0.01, outside]
              4: [-0.0001, 0.05, outside]
        stuck value qc:
          variables:
            BETA_BACKSCATTERING700: 3
    diagnostics: false
  - name: BBP from Beta
    diagnostics: false
  - name: Isolate BBP Spikes
    diagnostics: false

# ===========================================================
#                           OXYGEN
# ===========================================================
  - name: Derive Uncalibrated Phase
    parameters:
      blue_phase_name: BPHASE_DOXY
    diagnostics: false
  - name: Phase Pressure Correction
    parameters:
      optode_pressure_name: PRES
      correction_coefficient: 0.1
    diagnostics: false
  - name: Apply QC
    parameters:
      qc_settings:
        range qc:
          variable_ranges:
            UNCAL_PHASE_DOXY_PCORR:
              4: [1, -.inf, inside]
    diagnostics: false
  - name: Shift Oxygen To CTD
    parameters:
      shift_vars: [UNCAL_PHASE_DOXY_PCORR]
      lag_seconds: 3.945
    diagnostics: false
  - name: Derive Calibrated Phase
    parameters:
      uncalibrated_phase_name: UNCAL_PHASE_DOXY_PCORR_SHIFTED
      calib_coefficients: [0, 1, 0, 0]
    diagnostics: false
  - name: Derive Oxygen Concentration
    parameters:
      method: SVU
      temperature_name: TEMP
      svu_coefficients: [0.00267915, 0.000112428, 0.00000229021, 143.603, -0.208012, -35.9303, 2.82344]
    diagnostics: false
  - name: Molar DOXY Salinity Correction
    parameters:
      salinity_name: PRAC_SALINITY
      temperature_name: TEMP
    diagnostics: false
  - name: Molar DOXY Pressure Correction
    parameters:
      pressure_name: PRES
      temperature_name: TEMP
      molar_doxy_name: MOLAR_DOXY_PSAL
      uncalibrated_phase_correction_applied: true
    diagnostics: false
  - name: Correct Values
    parameters:
      target_variable: MOLAR_DOXY_PSAL_PRES
      output_as: MOLAR_DOXY_ADJUSTED
      append_description: Renamed from MOLAR_DOXY_PSAL_PRES.
    diagnostics: false

# ===========================================================
#                   CHLOROPHYLL CORRECTIONS
# ===========================================================
  - name: Mixed Layer Depth
    diagnostics: false
  - name: Apply QC
    parameters:
      qc_settings:
        range qc:
          variable_ranges:
            CHLA:
              4: [-0.2, 100, outside]
    diagnostics: false
  - name: Apply QC
    parameters:
      qc_settings:
        spike qc:
          variables:
            CHLA: 2
          window_size: 7
          plot: [CHLA]
    diagnostics: false
  - name: Deep Correction
    diagnostics: false
  - name: Apply QC
    parameters:
      qc_settings:
        range qc:
          variable_ranges:
            DEPTH:
              2: [-.inf, 2, outside]
              3: [-.inf, 2, inside]
          flag_instead:
            DEPTH: [CHLA, CHLA_ADJUSTED]
    diagnostics: false
  - name: CHLA Quenching
    parameters:
      method: thomalla2018
    diagnostics: false
  - name: Apply QC
    parameters:
      qc_settings:
        range qc:
          variable_ranges:
            CHLA_ADJUSTED:
              2: [0, 70, inside]
              3: [0, 50, outside]
              4: [0, 100, outside]
    diagnostics: false

# ===========================================================
#                          MANUAL QC
# ===========================================================
  - name: Apply QC
    parameters:
      qc_settings:
        manual qc:
          x_variable: TIME
          y_variable: PRES
          boxes: []
    diagnostics: true

# ===========================================================
#                         EXPORT DATA
# ===========================================================
  - name: Data Export
    parameters:
      output_path: examples/data/OG1/Churchill_501_Processed.nc
    diagnostics: false
  - name: Write Data Report
    diagnostics: false
