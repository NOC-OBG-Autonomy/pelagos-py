name: pelagos_py
channels:
  - conda-forge
dependencies:
  # Core environment (matches requirements.txt)
  - python
  - pip
  - numpy
  - pandas
  - scipy
  - xarray
  - netcdf4
  - h5py
  - h5netcdf
  - gsw
  - geopy
  - scikit-learn
  - matplotlib=3.11.0
  - requests
  - shapely
  - pvlib
  - tqdm
  - pyarrow
  - cartopy
  - pyyaml
  - psutil>=5.9
  - glidertest

  # Dashboard (config authoring/running web UI)
  - fastapi>=0.110
  - uvicorn>=0.29

  # Documentation and development tools
  - ipykernel
  - jupyterlab
  - sphinx
  - sphinx-autoapi
  - sphinx-rtd-theme
  - pydata-sphinx-theme
  - nbsphinx
  - numpydoc
  - sphinxcontrib-napoleon
  - sphinxcontrib-serializinghtml
  - myst-parser
  - pytest
  - ruff=0.16.10

  # Pypi only
  - pip:
    - glidertools
    - fpdf2
    - compliance-checker
    - cc-plugin-ncei
    - cc-plugin-og
    - autoapi
    - sphinx_copybutton
    - sphinx_last_updated_by_git
    - sphinx_codeautolink
    - sphinx_design
    - -e .
