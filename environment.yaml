name: pelagos_py
channels:
  - conda-forge
dependencies:
  # Core environment (matches requirements.txt)
  - python>=3.12
  - pip
  - numpy>=2.4
  - pandas>=3.0
  - scipy>=1.17
  - xarray>=2026.4
  - netcdf4>=1.7
  - h5py>=3.16
  - h5netcdf>=1.8
  - gsw>=3.6
  - geopy>=2.4
  - scikit-learn>=1.8
  - matplotlib>=3.11
  - requests>=2.33
  - shapely>=2.1
  - pvlib>=0.15
  - tqdm>=4.67
  - pyarrow>=26.0
  - cartopy>=0.25
  - pyyaml>=6.0
  - psutil>=5.9
  - glidertest>=1.0.1

  # Dashboard web UI
  - fastapi>=0.110
  - uvicorn>=0.29

  # Documentation and development tools
  - ipykernel
  - jupyterlab
  - sphinx
  - sphinx-autoapi
  - sphinx-rtd-theme
  - pydata-sphinx-theme
  - nbsphinx
  - numpydoc
  - sphinxcontrib-napoleon
  - sphinxcontrib-serializinghtml
  - myst-parser
  - pytest
  - ruff=0.16.10

  # Pypi only
  - pip:
    - fpdf2>=2.8
    - compliance-checker>=6.0
    - cc-plugin-ncei>=2.0
    - cc-plugin-og>=0.1
    - autoapi
    - sphinx_copybutton
    - sphinx_last_updated_by_git
    - sphinx_codeautolink
    - sphinx_design
    - -e .
